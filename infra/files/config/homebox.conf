# ==========================================================
# HOMEBOX : réglages des outils homebox-* (root, 0600)
# Ce fichier n'est jamais écrasé par infra-docker.sh.
# ==========================================================

# --- Notifications (ntfy) ---
# Installe l'application ntfy (Android, iOS ou ntfy.sh dans le navigateur)
# et abonne-toi à ce sujet. Le nom est aléatoire : garde-le secret,
# quiconque le connaît peut lire les messages.
# Laisse vide pour désactiver (les alertes restent dans le journal système).
NTFY_URL="__NTFY_URL__"
# Jeton d'accès si tu utilises ton propre serveur ntfy avec authentification
NTFY_TOKEN=""

# --- Contrôle de santé (homebox-healthcheck) ---
DISK_WARN_PERCENT=85        # alerte au-delà de ce taux d'occupation disque
BACKUP_MAX_AGE_HOURS=26     # alerte si la dernière sauvegarde est plus vieille
ALERT_REMIND_HOURS=24       # rappel tant qu'un problème persiste
OFFSITE_REQUIRED=true       # alerte tant que la copie externe n'est pas configurée
SSH_CHECK=true              # alerte si SSH accepte les mots de passe
# Conteneurs autorisés à publier un port sur toutes les interfaces
PUBLIC_PORTS_ALLOWED=""

# --- Seuils soutenus (moyenne sur ALERT_WINDOW_MIN minutes, d'après l'historique du dashboard) ---
ALERT_WINDOW_MIN=15
CPU_ALERT_PERCENT=90
MEM_ALERT_PERCENT=90
SWAP_ALERT_PERCENT=50
TEMP_ALERT=85               # °C, alerte si jamais redescendu en dessous pendant la fenêtre
CERT_WARN_DAYS=14           # certificats HTTPS des sites Caddy
# METRICS_DB=/srv/.data/metrics.db

# --- Rétention de la copie externe (restic) ---
OFFSITE_KEEP_DAILY=7
OFFSITE_KEEP_WEEKLY=4
OFFSITE_KEEP_MONTHLY=6
